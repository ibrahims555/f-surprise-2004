<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07071a">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Something for you">
  <meta property="og:description" content="Open when you are ready.">
  <title>For Falak</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%2307071a'/%3E%3Cpath d='M16 4c.8 7 3 9.2 10 12-7 2.800-9.200 5-10 12-.8-7-3-9.200-10-12 7-2.800 9.200-5 10-12z' fill='%23e6c992'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="night">

<div class="bg bg-night"></div>
<div class="bg bg-dusk"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>

<header class="chrome">
  <ol class="dots" id="dots" aria-hidden="true"></ol>
  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Turn music on">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</header>

<main id="stage">

  <!-- 1. Intro -->
  <section class="scene" id="s-intro" aria-label="Introduction">
    <div class="scene-inner">
      <div class="mystery" id="mystery"></div>
      <button class="orb" id="openBtn" type="button">
        <span class="orb-glow" aria-hidden="true"></span>
        <span class="orb-label" data-c="intro.button"></span>
      </button>
      <p class="hint" data-c="intro.hint"></p>
    </div>
  </section>

  <!-- 2. Greeting -->
  <section class="scene" id="s-greeting" aria-label="Birthday greeting">
    <div class="scene-inner">
      <p class="g-small" data-c="greeting.small" data-split></p>
      <h1 class="g-name"><span data-c="name"></span></h1>
      <p class="g-sub rise" style="--d:4.6s" data-c="greeting.sub"></p>
      <p class="g-line rise" style="--d:5.4s" data-c="greeting.line"></p>
      <button class="btn rise" style="--d:6.4s" type="button" data-next="memories" data-c="greeting.next"></button>
    </div>
  </section>

  <!-- 3. Memories -->
  <section class="scene" id="s-memories" aria-label="Memories">
    <div class="scene-inner">
      <h2 class="s-title" data-c="memories.title"></h2>
      <p class="s-hint" data-c="memories.hint"></p>
      <div class="deck" id="deck" tabindex="0" role="group" aria-label="Memory cards. Use the arrow keys to move between them."></div>
      <div class="deck-ctrl">
        <button class="round" id="mPrev" type="button" aria-label="Previous memory">‹</button>
        <span id="mCount" class="count" aria-live="polite"></span>
        <button class="round" id="mNext" type="button" aria-label="Next memory">›</button>
      </div>
      <button class="btn is-hidden" id="mDone" type="button" data-next="cake" data-c="memories.next"></button>
    </div>
  </section>

  <!-- 4. Cake -->
  <section class="scene" id="s-cake" aria-label="Birthday cake">
    <div class="scene-inner">
      <h2 class="s-title" data-c="cake.title"></h2>
      <p class="s-hint" id="cakeHint" data-c="cake.hint"></p>
      <div class="cake-wrap" id="cakeWrap">
        <div class="cake-glow" aria-hidden="true"></div>
        <div id="cake"></div>
      </div>
      <p class="cake-done" id="cakeDone" data-c="cake.done"></p>
      <button class="btn is-hidden" id="cakeNext" type="button" data-next="letter" data-c="cake.next"></button>
    </div>
  </section>

  <!-- 5. Letter -->
  <section class="scene" id="s-letter" aria-label="Letter">
    <div class="scene-inner">
      <div class="env" id="env">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <button class="seal" id="seal" type="button" aria-label="Open the letter"><span id="sealLetter">F</span></button>
      </div>
      <p class="s-hint" id="sealHint" data-c="letter.seal"></p>
      <article class="paper" id="paper" tabindex="0" aria-label="Your letter" hidden>
        <h2 class="paper-title" data-c="letter.title"></h2>
        <div class="paper-body" id="paperBody"></div>
        <p class="paper-sign" id="paperSign" data-c="letter.sign"></p>
      </article>
      <p class="skip is-hidden" id="skipHint" data-c="letter.skip"></p>
      <button class="btn is-hidden" id="letterNext" type="button" data-next="finale" data-c="letter.next"></button>
    </div>
  </section>

  <!-- 6. Finale -->
  <section class="scene" id="s-finale" aria-label="Final surprise">
    <div class="scene-inner">
      <button class="wish-star" id="wishStar" type="button" aria-label="Touch the star">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff6dc"/><stop offset=".5" stop-color="#e6c992"/><stop offset="1" stop-color="#f3c4ce"/>
            </linearGradient>
          </defs>
          <path d="M50 4C54 34 66 46 96 50 66 54 54 66 50 96 46 66 34 54 4 50 34 46 46 34 50 4Z" fill="url(#starGrad)"/>
        </svg>
      </button>
      <p class="s-hint" id="starPrompt" data-c="finale.prompt"></p>
      <div class="secret" id="secret" aria-live="polite"></div>
      <button class="btn is-hidden" id="replay" type="button" data-c="finale.replay"></button>
    </div>
  </section>

</main>

<canvas id="fx" aria-hidden="true"></canvas>

<noscript>
  <p style="position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:2rem;text-align:center;background:#07071a;color:#faf1e8">This surprise needs JavaScript to be turned on.</p>
</noscript>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
